[project]
name = "base-edit-safety"
version = "0.5.0"
description = "Off-target candidate search and evidence review for base-editing guides."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "bioinformatics",
    "base-editing",
    "crispr",
    "off-target",
    "sickle-cell",
    "thalassemia",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []   # the prediction tools are installed separately; see requirements-external.txt

[project.optional-dependencies]
lab = ["pysam==0.24.1", "psutil==7.1.0"]
test = ["pytest>=8"]
genomics = ["pysam>=0.24.1"]

[project.urls]
Repository = "https://github.com/tramngo1603/base-edit-safety"
Documentation = "https://github.com/tramngo1603/base-edit-safety/tree/main/docs"
Issues = "https://github.com/tramngo1603/base-edit-safety/issues"

[project.scripts]
bes-start = "base_edit_safety.launcher:main"
bes-search = "base_edit_safety.population.research:main"
bes-candidate-panel = "base_edit_safety.pipeline.candidate_panel:main"
bes-candidate-report = "base_edit_safety.pipeline.candidate_report:main"
bes-normalize-nominations = "base_edit_safety.pipeline.normalize_nominations:main"
bes-population = "base_edit_safety.pipeline.population:main"
bes-donor-panel = "base_edit_safety.pipeline.donor_panel:main"
bes-compare = "base_edit_safety.pipeline.comparison:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"base_edit_safety.population" = ["schemas/*.json", "protocols/*.json"]

[tool.setuptools.data-files]
"share/base-edit-safety" = [
    ".env.example",
    "LICENSE",
    "README.md",
    "requirements-external.txt",
]
